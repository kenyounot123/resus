name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Resus-mac
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
